<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Invoice Manager' }}</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#222}header{margin-bottom:2rem}nav{display:flex;gap:1rem;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:1rem}nav section{display:flex;gap:1rem;align-items:center}nav form{display:inline}form{display:grid;gap:.7rem;max-width:520px}input,select,button{padding:.55rem;font:inherit}button{cursor:pointer}.error{color:#a00;background:#fee;padding:.7rem}.success{background:#e8f7e8;padding:1rem}table{border-collapse:collapse;width:100%}th,td{padding:.5rem;border-bottom:1px solid #ddd;text-align:left}.filters{display:flex;flex-wrap:wrap;gap:.5rem;max-width:none}</style></head><body><header><nav aria-label="Navegación principal"><section aria-label="Opciones"><a href="/">Generar</a><a href="/invoices">Historial</a>{% if is_admin %}<a href="/admin/users">Usuarios</a>{% endif %}</section>{% if user %}<section aria-label="Cuenta"><span>{{ user }}</span><form method="post" action="/logout" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button type="submit">Cerrar Sesión</button></form></section>{% endif %}</nav></header>{% block content %}{% endblock %}</body></html>
